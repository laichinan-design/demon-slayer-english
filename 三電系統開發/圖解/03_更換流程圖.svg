<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC','WenQuanYi Zen Hei',sans-serif">
<rect width="1600" height="1000" fill="#FFFFFF"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#1F3864">電池更換流程圖：日常使用 → 訂閱換新 → 翻新迴圈</text>
<text x="40" y="82" font-size="16" fill="#6B7280">三條泳道：用戶／經銷點與物流／翻新中心（營運商）。電池為訂閱資產，所有權始終在營運商</text>
<line x1="40" y1="96" x2="1560" y2="96" stroke="#1F3864" stroke-width="2"/>
<rect x="40" y="120" width="1520" height="240" fill="#EFF6FF" stroke="#6B7280" stroke-width="1"/><text x="56" y="148" font-size="17" font-weight="700" fill="#1F3864">用戶</text><rect x="40" y="380" width="1520" height="240" fill="#F0FDF4" stroke="#6B7280" stroke-width="1"/><text x="56" y="408" font-size="17" font-weight="700" fill="#1F3864">經銷點 ／ 物流（UN3480 陸運）</text><rect x="40" y="640" width="1520" height="240" fill="#FFF7ED" stroke="#6B7280" stroke-width="1"/><text x="56" y="668" font-size="17" font-weight="700" fill="#1F3864">翻新中心（營運商）</text><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="70" y="170" width="200" height="120" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2.5"/><text x="170.0" y="194" font-size="15" font-weight="700" fill="#1F3864" text-anchor="middle">① 日常使用</text><text x="170.0" y="216" font-size="12.5" fill="#111827" text-anchor="middle">鑰匙解鎖 → 抽出電池 5 秒</text><text x="170.0" y="234" font-size="12.5" fill="#111827" text-anchor="middle">家中以隨訂閱充電器充電</text><text x="170.0" y="252" font-size="12.5" fill="#111827" text-anchor="middle">APP 顯示 SoH、里程、電量</text><rect x="320" y="170" width="220" height="120" rx="10" fill="#fff" stroke="#E67E22" stroke-width="2.5"/><text x="430.0" y="194" font-size="15" font-weight="700" fill="#E67E22" text-anchor="middle">② 觸發條件（APP 推播）</text><text x="430.0" y="216" font-size="12.5" fill="#111827" text-anchor="middle">SoH &lt; 70%（免費換新）</text><text x="430.0" y="234" font-size="12.5" fill="#111827" text-anchor="middle">故障碼 / 失竊申報</text><text x="430.0" y="252" font-size="12.5" fill="#111827" text-anchor="middle">想升級 252 → 360Wh（改月費）</text><rect x="590" y="170" width="200" height="120" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2.5"/><text x="690.0" y="194" font-size="15" font-weight="700" fill="#1F3864" text-anchor="middle">③ 預約經銷點</text><text x="690.0" y="216" font-size="12.5" fill="#111827" text-anchor="middle">APP 選點、預約時段</text><text x="690.0" y="234" font-size="12.5" fill="#111827" text-anchor="middle">同型號電池已備好</text><text x="690.0" y="252" font-size="12.5" fill="#111827" text-anchor="middle">（3 種容量同殼互換）</text><rect x="840" y="170" width="220" height="120" rx="10" fill="#fff" stroke="#1F3864" stroke-width="2.5"/><text x="950.0" y="194" font-size="15" font-weight="700" fill="#1F3864" text-anchor="middle">④ 到店 5 分鐘完成</text><text x="950.0" y="216" font-size="12.5" fill="#111827" text-anchor="middle">舊包退出 → 新包插入</text><text x="950.0" y="234" font-size="12.5" fill="#111827" text-anchor="middle">護照 / SoH 歷程移轉到新包</text><text x="950.0" y="252" font-size="12.5" fill="#111827" text-anchor="middle">騎乘參數（演算法）雲端同步</text><rect x="1110" y="170" width="200" height="120" rx="10" fill="#fff" stroke="#138D75" stroke-width="2.5"/><text x="1210.0" y="194" font-size="15" font-weight="700" fill="#138D75" text-anchor="middle">⑤ 繼續使用</text><text x="1210.0" y="216" font-size="12.5" fill="#111827" text-anchor="middle">月費不變（同容量）</text><text x="1210.0" y="234" font-size="12.5" fill="#111827" text-anchor="middle">升級容量則改月費</text><text x="1210.0" y="252" font-size="12.5" fill="#111827" text-anchor="middle">停止付費 → 回家模式</text><rect x="1360" y="170" width="180" height="120" rx="10" fill="#fff" stroke="#6B7280" stroke-width="2.5"/><text x="1450.0" y="194" font-size="15" font-weight="700" fill="#6B7280" text-anchor="middle">或：買斷選項</text><text x="1450.0" y="216" font-size="12.5" fill="#111827" text-anchor="middle">€129 / NT$3,990 / ¥19,800</text><text x="1450.0" y="234" font-size="12.5" fill="#111827" text-anchor="middle">退出訂閱、失去換新</text><text x="1450.0" y="252" font-size="12.5" fill="#111827" text-anchor="middle">與失竊補償</text><line x1="270" y1="230" x2="320" y2="230" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><line x1="540" y1="230" x2="590" y2="230" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><line x1="790" y1="230" x2="840" y2="230" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><line x1="1060" y1="230" x2="1110" y2="230" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><line x1="1310" y1="230" x2="1360" y2="230" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="6 4"/><rect x="840" y="430" width="220" height="110" rx="10" fill="#fff" stroke="#166534" stroke-width="2.5"/><text x="950.0" y="454" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">⑥ 經銷點收舊包</text><text x="950.0" y="476" font-size="12.5" fill="#111827" text-anchor="middle">外觀 / 電壓初檢、貼標</text><text x="950.0" y="494" font-size="12.5" fill="#111827" text-anchor="middle">暫存於防火櫃</text><text x="950.0" y="512" font-size="12.5" fill="#111827" text-anchor="middle">每週集運（不走一般包裹）</text><rect x="1110" y="430" width="200" height="110" rx="10" fill="#fff" stroke="#166534" stroke-width="2.5"/><text x="1210.0" y="454" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">⑦ UN3480 陸運集運</text><text x="1210.0" y="476" font-size="12.5" fill="#111827" text-anchor="middle">危險品陸運 €20–50/程</text><text x="1210.0" y="494" font-size="12.5" fill="#111827" text-anchor="middle">走經銷點 / 回收點網路</text><text x="1210.0" y="512" font-size="12.5" fill="#111827" text-anchor="middle">電池法 Art.60–62 回收義務</text><rect x="590" y="430" width="200" height="110" rx="10" fill="#fff" stroke="#166534" stroke-width="2.5"/><text x="690.0" y="454" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">⑧ 新包配送到店</text><text x="690.0" y="476" font-size="12.5" fill="#111827" text-anchor="middle">翻新 A 級或全新</text><text x="690.0" y="494" font-size="12.5" fill="#111827" text-anchor="middle">隨經銷點常備 3 容量</text><text x="690.0" y="512" font-size="12.5" fill="#111827" text-anchor="middle">4kg 級箱裝件</text><line x1="950" y1="290" x2="950" y2="430" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><text x="950.0" y="352.0" font-size="12" fill="#374151" text-anchor="middle" font-weight="700">舊包</text><line x1="1060" y1="485" x2="1110" y2="485" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><line x1="690" y1="430" x2="690" y2="290" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><text x="690.0" y="352.0" font-size="12" fill="#374151" text-anchor="middle" font-weight="700">新包</text><rect x="1110" y="690" width="200" height="120" rx="10" fill="#fff" stroke="#E67E22" stroke-width="2.5"/><text x="1210.0" y="714" font-size="15" font-weight="700" fill="#E67E22" text-anchor="middle">⑨ 檢測與開殼</text><text x="1210.0" y="736" font-size="12.5" fill="#111827" text-anchor="middle">容量 / 內阻 / 循環數</text><text x="1210.0" y="754" font-size="12.5" fill="#111827" text-anchor="middle">8 顆螺絲開殼 2 分鐘</text><text x="1210.0" y="772" font-size="12.5" fill="#111827" text-anchor="middle">單顆電芯量測（20 顆）</text><rect x="860" y="690" width="200" height="120" rx="10" fill="#fff" stroke="#E67E22" stroke-width="2.5"/><text x="960.0" y="714" font-size="15" font-weight="700" fill="#E67E22" text-anchor="middle">⑩ 單顆電芯更換</text><text x="960.0" y="736" font-size="12.5" fill="#111827" text-anchor="middle">只換 SoH &lt; 80% 的電芯</text><text x="960.0" y="754" font-size="12.5" fill="#111827" text-anchor="middle">彈簧接點免點焊</text><text x="960.0" y="772" font-size="12.5" fill="#111827" text-anchor="middle">翻新成本約新品 30%</text><rect x="610" y="690" width="200" height="120" rx="10" fill="#fff" stroke="#E67E22" stroke-width="2.5"/><text x="710.0" y="714" font-size="15" font-weight="700" fill="#E67E22" text-anchor="middle">⑪ 重組 / 分級</text><text x="710.0" y="736" font-size="12.5" fill="#111827" text-anchor="middle">A 級 ≥ 90%：回投放</text><text x="710.0" y="754" font-size="12.5" fill="#111827" text-anchor="middle">B 級 80–90%：降階給低里程</text><text x="710.0" y="772" font-size="12.5" fill="#111827" text-anchor="middle">C 級 &lt; 80%：電芯回收</text><rect x="360" y="690" width="200" height="120" rx="10" fill="#fff" stroke="#138D75" stroke-width="2.5"/><text x="460.0" y="714" font-size="15" font-weight="700" fill="#138D75" text-anchor="middle">⑫ 更新電池護照</text><text x="460.0" y="736" font-size="12.5" fill="#111827" text-anchor="middle">新 SoH、循環數、來源</text><text x="460.0" y="754" font-size="12.5" fill="#111827" text-anchor="middle">殘值定價 / 保固預測</text><text x="460.0" y="772" font-size="12.5" fill="#111827" text-anchor="middle">duty cycle 數據回饋配電</text><line x1="1210" y1="540" x2="1210" y2="690" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><line x1="1110" y1="750" x2="1060" y2="750" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><line x1="860" y1="750" x2="810" y2="750" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><line x1="610" y1="750" x2="560" y2="750" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><line x1="460" y1="690" x2="460" y2="560" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="6 4"/><line x1="460" y1="560" x2="590" y2="485" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="6 4"/><text x="470" y="620" font-size="12" fill="#138D75" font-weight="700">A/B 級回投放</text><rect x="40" y="895" width="1520" height="90" rx="10" fill="#F3F4F6" stroke="#6B7280"/><text x="60" y="922" font-size="15" font-weight="700" fill="#1F3864">商業模式對照</text><text x="60" y="946" font-size="13.5" fill="#111827"><tspan font-weight="700" fill="#1F3864">賣斷</tspan>：整車去變速；車架、輪組、馬達、控制器、踏頻感測、煞車一次性售出（一般保固）。　<tspan font-weight="700" fill="#E67E22">訂閱</tspan>：電池 + 充電器 + SoH&lt;70% 換新 + 失竊補償 + 容量升降級。</text><text x="60" y="970" font-size="13.5" fill="#111827"><tspan font-weight="700" fill="#138D75">軟體</tspan>：騎乘動力輸出演算法（起步電流曲線、巡航阻尼、25 km/h 軟著陸）隨訂閱 OTA；限速與功率鎖 OTP。它是體驗，不是護城河——護城河在配電、二次電芯與翻新迴圈（約 RMB 186/台）。</text></svg>