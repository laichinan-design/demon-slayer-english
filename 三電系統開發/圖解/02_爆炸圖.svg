<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC','WenQuanYi Zen Hei',sans-serif">
<rect width="1600" height="1000" fill="#FFFFFF"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#1F3864">爆炸圖：電芯級可更換電池包（訂閱資產）與後輪轂馬達總成（賣斷）</text>
<text x="40" y="82" font-size="16" fill="#6B7280">電池包：螺絲殼體 + 電芯座 + 彈簧接點取代點焊鎳片，符合歐盟電池法 Art.11（2027/2/18）；馬達：商品化齒輪輪轂 + 整合控制器側蓋</text>
<line x1="40" y1="96" x2="1560" y2="96" stroke="#1F3864" stroke-width="2"/>
<line x1="350.0" y1="120" x2="350.0" y2="690" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M 140 150 l 420 0 l 36 -36 l -420 0 z" fill="#F5B57A" stroke="#B4530A" stroke-width="2" opacity="0.85"/><path d="M 560 150 l 36 -36 l 0 26 l -36 36 z" fill="#F5B57A" stroke="#B4530A" stroke-width="2" opacity="0.6"/><rect x="140" y="150" width="420" height="26" fill="#F5B57A" stroke="#B4530A" stroke-width="2"/><text x="350.0" y="168.0" font-size="14" fill="#7C3A06" text-anchor="middle" font-weight="700">上蓋（螺絲 ×8）</text><line x1="600" y1="145.0" x2="666" y2="145.0" stroke="#E67E22" stroke-width="1.6"/><circle cx="600" cy="145.0" r="4" fill="#E67E22"/><text x="674" y="150.0" font-size="16" font-weight="700" fill="#E67E22" text-anchor="start">上蓋：8 顆 M3 螺絲，非膠合／熔接</text><text x="674" y="169.0" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">開殼 2 分鐘；IP65 靠 EPDM 墊圈</text><path d="M 140 232 l 420 0 l 36 -36 l -420 0 z" fill="#2E86C1" stroke="#1B4F72" stroke-width="2" opacity="0.85"/><path d="M 560 232 l 36 -36 l 0 22 l -36 36 z" fill="#2E86C1" stroke="#1B4F72" stroke-width="2" opacity="0.6"/><rect x="140" y="232" width="420" height="22" fill="#2E86C1" stroke="#1B4F72" stroke-width="2"/><text x="350.0" y="248.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">BMS 板：10s 均衡、BLE、SoH、電池護照</text><line x1="600" y1="225.0" x2="666" y2="225.0" stroke="#E67E22" stroke-width="1.6"/><circle cx="600" cy="225.0" r="4" fill="#E67E22"/><text x="674" y="230.0" font-size="16" font-weight="700" fill="#E67E22" text-anchor="start">BMS：CAN/BLE 回報 SoH、循環數、溫度</text><text x="674" y="249.0" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">Art.77 電池護照 QR 資料存於此板</text><path d="M 140 300 l 420 0 l 36 -36 l -420 0 z" fill="#7F8C8D" stroke="#4D5656" stroke-width="2" opacity="0.85"/><path d="M 560 300 l 36 -36 l 0 22 l -36 36 z" fill="#7F8C8D" stroke="#4D5656" stroke-width="2" opacity="0.6"/><rect x="140" y="300" width="420" height="22" fill="#7F8C8D" stroke="#4D5656" stroke-width="2"/><text x="350.0" y="316.0" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">匯流排 / 彈簧接點板（螺絲固定）</text><line x1="600" y1="293.0" x2="666" y2="293.0" stroke="#E67E22" stroke-width="1.6"/><circle cx="600" cy="293.0" r="4" fill="#E67E22"/><text x="674" y="298.0" font-size="16" font-weight="700" fill="#E67E22" text-anchor="start">取代點焊鎳片：彈簧接點 + 螺絲匯流排</text><text x="674" y="317.0" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">單顆電芯可抽換，不需重新點焊</text><path d="M 140 372 l 420 0 l 36 -36 l -420 0 z" fill="#FDEBD0" stroke="#B4530A" stroke-width="2" opacity="0.85"/><path d="M 560 372 l 36 -36 l 0 150 l -36 36 z" fill="#FDEBD0" stroke="#B4530A" stroke-width="2" opacity="0.6"/><rect x="140" y="372" width="420" height="150" fill="#FDEBD0" stroke="#B4530A" stroke-width="2"/><circle cx="170" cy="412" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="170" cy="412" r="5" fill="#111827"/><circle cx="210" cy="412" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="210" cy="412" r="5" fill="#111827"/><circle cx="250" cy="412" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="250" cy="412" r="5" fill="#111827"/><circle cx="290" cy="412" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="290" cy="412" r="5" fill="#111827"/><circle cx="330" cy="412" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="330" cy="412" r="5" fill="#111827"/><circle cx="370" cy="412" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="370" cy="412" r="5" fill="#111827"/><circle cx="410" cy="412" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="410" cy="412" r="5" fill="#111827"/><circle cx="450" cy="412" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="450" cy="412" r="5" fill="#111827"/><circle cx="490" cy="412" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="490" cy="412" r="5" fill="#111827"/><circle cx="530" cy="412" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="530" cy="412" r="5" fill="#111827"/><circle cx="170" cy="482" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="170" cy="482" r="5" fill="#111827"/><circle cx="210" cy="482" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="210" cy="482" r="5" fill="#111827"/><circle cx="250" cy="482" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="250" cy="482" r="5" fill="#111827"/><circle cx="290" cy="482" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="290" cy="482" r="5" fill="#111827"/><circle cx="330" cy="482" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="330" cy="482" r="5" fill="#111827"/><circle cx="370" cy="482" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="370" cy="482" r="5" fill="#111827"/><circle cx="410" cy="482" r="16" fill="#DC2626" stroke="#111827" stroke-width="1.5"/><circle cx="410" cy="482" r="5" fill="#111827"/><text x="410" y="516" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">單顆更換</text><circle cx="450" cy="482" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="450" cy="482" r="5" fill="#111827"/><circle cx="490" cy="482" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="490" cy="482" r="5" fill="#111827"/><circle cx="530" cy="482" r="16" fill="#5DADE2" stroke="#111827" stroke-width="1.5"/><circle cx="530" cy="482" r="5" fill="#111827"/><text x="152" y="392" font-size="13" fill="#7C3A06" font-weight="700">電芯座（10s2p × 18650）</text><line x1="600" y1="429.0" x2="666" y2="429.0" stroke="#E67E22" stroke-width="1.6"/><circle cx="600" cy="429.0" r="4" fill="#E67E22"/><text x="674" y="434.0" font-size="16" font-weight="700" fill="#E67E22" text-anchor="start">電芯座：20 顆 18650，10s2p，獨立槽位</text><text x="674" y="453.0" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">SoH &lt; 80% 的電芯單顆更換</text><text x="674" y="472.0" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">翻新成本約新品 30%</text><path d="M 140 572 l 420 0 l 36 -36 l -420 0 z" fill="#F5B57A" stroke="#B4530A" stroke-width="2" opacity="0.85"/><path d="M 560 572 l 36 -36 l 0 60 l -36 36 z" fill="#F5B57A" stroke="#B4530A" stroke-width="2" opacity="0.6"/><rect x="140" y="572" width="420" height="60" fill="#F5B57A" stroke="#B4530A" stroke-width="2"/><text x="350.0" y="607.0" font-size="14" fill="#7C3A06" text-anchor="middle" font-weight="700">下殼：滑軌、鑰匙鎖、放電連接器、NTC</text><line x1="600" y1="584.0" x2="666" y2="584.0" stroke="#E67E22" stroke-width="1.6"/><circle cx="600" cy="584.0" r="4" fill="#E67E22"/><text x="674" y="589.0" font-size="16" font-weight="700" fill="#E67E22" text-anchor="start">下殼：滑軌 + 鑰匙鎖 + 防呆連接器</text><text x="674" y="608.0" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">同一外殼三種填充率</text><text x="674" y="627.0" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">180 / 252 / 360Wh 完全互換</text><circle cx="160" cy="140" r="4" fill="none" stroke="#111827" stroke-width="1.5"/><circle cx="217" cy="140" r="4" fill="none" stroke="#111827" stroke-width="1.5"/><circle cx="274" cy="140" r="4" fill="none" stroke="#111827" stroke-width="1.5"/><circle cx="331" cy="140" r="4" fill="none" stroke="#111827" stroke-width="1.5"/><circle cx="388" cy="140" r="4" fill="none" stroke="#111827" stroke-width="1.5"/><circle cx="445" cy="140" r="4" fill="none" stroke="#111827" stroke-width="1.5"/><circle cx="502" cy="140" r="4" fill="none" stroke="#111827" stroke-width="1.5"/><circle cx="559" cy="140" r="4" fill="none" stroke="#111827" stroke-width="1.5"/><text x="140" y="112" font-size="18" font-weight="700" fill="#E67E22">A. 電池包（訂閱資產）— 分解順序由上而下</text><path d="M 140 700 l 150 0 l 30 -30 l -150 0 z" fill="#F5B57A" stroke="#B4530A" stroke-width="2" opacity="0.85"/><path d="M 290 700 l 30 -30 l 0 40 l -30 30 z" fill="#F5B57A" stroke="#B4530A" stroke-width="2" opacity="0.6"/><rect x="140" y="700" width="150" height="40" fill="#F5B57A" stroke="#B4530A" stroke-width="2"/><text x="215.0" y="725.0" font-size="14" fill="#7C3A06" text-anchor="middle" font-weight="700">充電器 36V 2A</text><text x="340" y="726" font-size="14" fill="#374151">隨訂閱提供；不含在車價內</text><text x="1050" y="130" font-size="18" font-weight="700" fill="#1F3864">B. 後輪轂馬達總成（賣斷）— 沿軸向分解</text><line x1="1030" y1="360" x2="1570" y2="360" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="8 6"/><ellipse cx="1070" cy="360" rx="50" ry="110" fill="#D1D5DB" stroke="#111827" stroke-width="3"/><ellipse cx="1070" cy="360" rx="40" ry="90" fill="#fff" stroke="#111827" stroke-width="2.0999999999999996"/><text x="1070" y="494" font-size="13.5" font-weight="700" fill="#1F3864" text-anchor="middle">外殼 + 輻條法蘭</text><ellipse cx="1170" cy="360" rx="36" ry="80" fill="#9CA3AF" stroke="#111827" stroke-width="3"/><ellipse cx="1170" cy="360" rx="11" ry="25" fill="#fff" stroke="#111827" stroke-width="2.0999999999999996"/><text x="1170" y="464" font-size="13.5" font-weight="700" fill="#1F3864" text-anchor="middle">定子 + 繞組</text><ellipse cx="1260" cy="360" rx="25" ry="55" fill="#F59E0B" stroke="#92400E" stroke-width="3"/><ellipse cx="1260" cy="360" rx="5" ry="12" fill="#fff" stroke="#92400E" stroke-width="2.0999999999999996"/><text x="1260" y="439" font-size="13.5" font-weight="700" fill="#1F3864" text-anchor="middle">行星齒輪組</text><ellipse cx="1350" cy="360" rx="10" ry="22" fill="#4B5563" stroke="#111827" stroke-width="3"/><text x="1350" y="406" font-size="13.5" font-weight="700" fill="#1F3864" text-anchor="middle">軸心 + 線束</text><ellipse cx="1440" cy="360" rx="43" ry="95" fill="#1F3864" stroke="#0B1F3A" stroke-width="3"/><text x="1440" y="479" font-size="13.5" font-weight="700" fill="#1F3864" text-anchor="middle">側蓋（整合控制器）</text><ellipse cx="1540" cy="360" rx="18" ry="40" fill="#374151" stroke="#111827" stroke-width="3"/><ellipse cx="1540" cy="360" rx="9" ry="20" fill="#fff" stroke="#111827" stroke-width="2.0999999999999996"/><text x="1540" y="424" font-size="13.5" font-weight="700" fill="#1F3864" text-anchor="middle">單速飛輪 16T</text><rect x="1020" y="510" width="600" height="190" rx="8" fill="#F3F4F6" stroke="#6B7280"/><text x="1035" y="538" font-size="13.5" fill="#111827"><tspan font-weight="700" fill="#1F3864">外殼 + 輻條法蘭：</tspan>轉子外殼：ADC12 壓鑄，雙側輻條法蘭，36H</text><text x="1035" y="565" font-size="13.5" fill="#111827"><tspan font-weight="700" fill="#1F3864">定子 + 繞組：</tspan>250W 內定子，霍爾 ×3；輪端 30–32 N·m</text><text x="1035" y="592" font-size="13.5" fill="#111827"><tspan font-weight="700" fill="#1F3864">行星齒輪組：</tspan>減速比約 1:5–1:6，尼龍/鋼齒輪，單向離合</text><text x="1035" y="619" font-size="13.5" fill="#111827"><tspan font-weight="700" fill="#1F3864">軸心 + 線束：</tspan>135mm 開檔軸心；9 芯防水線經軸心出線</text><text x="1035" y="646" font-size="13.5" fill="#111827"><tspan font-weight="700" fill="#1F3864">側蓋（整合控制器）：</tspan>36V 15A 正弦波控制器封裝於側蓋，殼體導熱；省外掛盒 RMB 32</text><text x="1035" y="673" font-size="13.5" fill="#111827"><tspan font-weight="700" fill="#1F3864">單速飛輪 16T：</tspan>螺紋式單速飛輪，無多段飛輪體</text><rect x="1020" y="720" width="600" height="120" rx="8" fill="#FFF7ED" stroke="#E67E22"/><text x="1035" y="746" font-size="15" font-weight="700" fill="#E67E22">為什麼電池不放輪內</text><text x="1035" y="772" font-size="13" fill="#111827">• 135mm 開檔放不下 Ø130 母模；客製馬達 RMB 205 → 500，模組 RMB 282 → 550</text><text x="1035" y="794" font-size="13" fill="#111827">• 馬達殼 60–90°C 傳熱給電芯：更換週期 48 → 36 月，訂閱制下這是營運商成本</text><text x="1035" y="816" font-size="13" fill="#111827">• IP67 點焊環形模組不符 Art.11 電芯級可換；車架包做到只加 RMB 20</text><g font-size="15"><rect x="40" y="922" width="26" height="16" rx="3" fill="#1F3864"/><text x="74" y="935" fill="#111827">賣斷（一次性）：車架、輪組、馬達、控制器、感測、煞車</text><rect x="40" y="948" width="26" height="16" rx="3" fill="#E67E22"/><text x="74" y="961" fill="#111827">訂閱（月費）：電池 + 充電器 + SoH&lt;70% 換新 + 失竊補償</text><rect x="40" y="974" width="26" height="16" rx="3" fill="#138D75"/><text x="74" y="987" fill="#111827">軟體：騎乘動力輸出演算法，隨訂閱 OTA（非護城河）</text></g></svg>