ct x="40" y="974" width="26" height="16" rx="3" fill="#138D75"/><text x="74" y="987" fill="#111827">軟體：騎乘動力輸出演算法，隨訂閱 OTA（非護城河）</text></g><rect x="1200" y="868" width="360" height="118" rx="10" fill="#F3F4F6" stroke="#6B7280"/><text x="1216" y="892" font-size="15" font-weight="700" fill="#1F3864">商業模式</text><text x="1216" y="914" font-size="13" fill="#111827">整車去變速；車體 + 馬達 + 電控 + 感測賣斷</text><text x="1216" y="934" font-size="13" fill="#111827">（歐洲 DTC 約 €184 / 台灣 NT$7,165）</text><text x="1216" y="954" font-size="13" fill="#111827">只有電池 + 充電器訂閱：€7.9–12.9 / NT$249–399</text><text x="1216" y="974" font-size="13" fill="#111827">/ ¥980–1,680；動力輸出演算法隨訂閱 OTA</text></svg>