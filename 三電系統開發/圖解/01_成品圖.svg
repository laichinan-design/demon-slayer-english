" y1="700" x2="520" y2="812" stroke="#374151" stroke-width="6"/><line x1="510" y1="610" x2="250" y2="300" stroke="#1F3864" stroke-width="1.6"/><circle cx="510" cy="610" r="4" fill="#1F3864"/><text x="242" y="305" font-size="16" font-weight="700" fill="#1F3864" text-anchor="end">① 250W 齒輪後輪轂馬達（賣斷）</text><text x="242" y="324" font-size="13.5" font-weight="400" fill="#374151" text-anchor="end">商品化 2.3–3.0 kg、30–32 N·m</text><text x="242" y="343" font-size="13.5" font-weight="400" fill="#374151" text-anchor="end">控制器整合側蓋、36V 正弦波</text><text x="242" y="362" font-size="13.5" font-weight="400" fill="#374151" text-anchor="end">螺紋單速飛輪 16T</text><line x1="745" y1="692" x2="560" y2="860" stroke="#1F3864" stroke-width="1.6"/><circle cx="745" cy="692" r="4" fill="#1F3864"/><text x="568" y="865" font-size="16" font-weight="700" fill="#1F3864" text-anchor="start">② 單速傳動 + 踏頻感測（賣斷）</text><text x="568" y="884" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">42T 曲柄 / 16T 飛輪，無變速器</text><text x="568" y="903" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">12 磁 PAS 踏頻盤 + 煞把斷電 ×2</text><text x="568" y="922" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">起步：速度分段電流曲線（軟體）</text><line x1="886.5" y1="530.0" x2="1180" y2="250" stroke="#E67E22" stroke-width="1.6"/><circle cx="886.5" cy="530.0" r="4" fill="#E67E22"/><text x="1188" y="255" font-size="16" font-weight="700" fill="#E67E22" text-anchor="start">③ 電池 36V 252Wh（訂閱）</text><text x="1188" y="274" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">10s2p 18650 中系電芯，約 1.4 kg</text><text x="1188" y="293" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">下管滑軌 + 鑰匙鎖，5 秒單手抽出</text><text x="1188" y="312" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">螺絲殼體、電芯座：單顆電芯可換</text><text x="1188" y="331" font-size="13.5" font-weight="400" fill="#374151" text-anchor="start">BMS 含 BLE：SoH、里程、電池護照</text><line x1="802.5" y1="349.0" x2